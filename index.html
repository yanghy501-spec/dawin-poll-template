<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 인터랙티브 투표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0A0E1A; --panel:#141B2E; --panel2:#1C2540; --line:#2A3555;
  --tx:#F2F5FF; --tx2:#9AA7C7; --tx3:#6B7899;
  --ac:#4F7BFF; --ac2:#22D3A7; --ac3:#FFB020; --ac4:#FF5C7A;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
.hide{display:none !important}

/* ---------- 공통 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;background:var(--panel2);color:var(--tx);
  font-size:15px;font-weight:600;border:1px solid var(--line);transition:.15s}
.btn:hover{background:#26325a}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#3d68ee}
.btn.ok{background:var(--ac2);border-color:var(--ac2);color:#04241B}
.btn.warn{background:transparent;border-color:#4a3a2a;color:var(--ac3)}
.btn.danger{background:transparent;border-color:#4a2a34;color:var(--ac4)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:#0F1526;color:var(--tx);font-size:15px;outline:none}
.inp:focus{border-color:var(--ac)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:rgba(79,123,255,.14);color:#9DB5FF;font-size:12px;font-weight:700;letter-spacing:.2px}
.chip.g{background:rgba(34,211,167,.14);color:#5FE9C4}
.chip.o{background:rgba(255,176,32,.14);color:#FFC85C}
.muted{color:var(--tx2)}
.tiny{font-size:12px;color:var(--tx3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{display:flex;align-items:center;justify-content:center}

/* ---------- 셋업 / 홈 ---------- */
.shell{max-width:900px;margin:0 auto;padding:24px 18px 80px}
.brand{display:flex;align-items:center;gap:11px;margin:8px 0 22px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--tx3)}
.sec{margin-bottom:14px}
.sec h2{font-size:14px;margin:0 0 10px;color:var(--tx2);font-weight:700;letter-spacing:.2px}
code.k{background:#0F1526;border:1px solid var(--line);border-radius:8px;padding:2px 7px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#8FD8FF;word-break:break-all}
pre.k{background:#0B1120;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#8FD8FF;line-height:1.6;margin:0}

/* ---------- 질문 편집 ---------- */
.qitem{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.qnum{width:28px;height:28px;border-radius:9px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--tx2);flex:none}
.qbody{flex:1;min-width:0}
.qtitle{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.35;word-break:keep-all}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qacts{display:flex;gap:4px;flex:none}
.iconbtn{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx2)}
.iconbtn:hover{color:var(--tx);background:#26325a}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(4,7,15,.78);backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  width:100%;max-width:620px;padding:22px;margin:auto}
.modal h3{margin:0 0 16px;font-size:17px;font-weight:800}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.typebtn{padding:13px 12px;border-radius:13px;background:#0F1526;border:1.5px solid var(--line);text-align:left}
.typebtn.on{border-color:var(--ac);background:rgba(79,123,255,.12)}
.typebtn b{display:block;font-size:14px;margin-bottom:3px}
.typebtn span{font-size:11.5px;color:var(--tx3);line-height:1.4}

/* ---------- 진행(발표) 화면 ---------- */
.stage{height:100dvh;display:flex;flex-direction:column;padding:22px 26px;gap:16px}
.stagetop{display:flex;align-items:center;gap:14px;flex:none}
.stagetop .pill{font-size:13px;font-weight:700;color:var(--tx2)}
.stagemain{flex:1;display:flex;gap:22px;min-height:0}
.side{width:290px;flex:none;display:flex;flex-direction:column;gap:12px}
.qrbox{background:#fff;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center}
.qrbox img,.qrbox canvas{display:block;width:100%;height:auto;max-width:230px}
.joinurl{font-size:13.5px;font-weight:700;color:#8FD8FF;word-break:break-all;text-align:center;line-height:1.45}
.codebig{font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--tx);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.counter{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.counter .n{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px}
.counter .l{font-size:12px;color:var(--tx3);margin-top:5px;font-weight:700}
.mainpanel{flex:1;display:flex;flex-direction:column;min-width:0;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px}
.qhead{font-size:clamp(22px,2.6vw,40px);font-weight:800;line-height:1.28;letter-spacing:-.5px;
  margin:0 0 20px;word-break:keep-all;flex:none}
.viz{flex:1;min-height:0;overflow:auto}
.viz.choice,.viz.scale,.viz.empty{display:flex;flex-direction:column;justify-content:center}
.viz.word{display:flex;align-items:center}
.viz::-webkit-scrollbar{width:8px}
.viz::-webkit-scrollbar-thumb{background:#2A3555;border-radius:9px}
.stagebar{flex:none;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* 막대 */
.bar{margin-bottom:14px}
.barlbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.barlbl .t{font-size:clamp(15px,1.5vw,21px);font-weight:700;word-break:keep-all}
.barlbl .v{font-size:clamp(15px,1.5vw,21px);font-weight:900;flex:none;color:var(--tx)}
.barlbl .v small{font-size:.62em;color:var(--tx3);font-weight:700;margin-left:6px}
.bartrack{height:clamp(20px,2.2vw,32px);background:#0F1526;border-radius:9px;overflow:hidden}
.barfill{height:100%;border-radius:9px;transition:width .55s cubic-bezier(.2,.8,.3,1);min-width:3px}

/* 척도 */
.scalewrap{display:flex;gap:10px;align-items:flex-end;flex:1;max-height:56vh;min-height:150px;margin-bottom:18px}
.scalecol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.scalebar{width:100%;border-radius:11px 11px 4px 4px;transition:height .55s cubic-bezier(.2,.8,.3,1);min-height:4px}
.scalen{font-size:15px;font-weight:800;color:var(--tx2)}
.avgbox{display:flex;align-items:baseline;gap:14px;padding:16px 20px;background:#0F1526;border-radius:16px;border:1px solid var(--line)}
.avgbox .big{font-size:clamp(36px,4.5vw,62px);font-weight:900;line-height:1;color:var(--ac2);letter-spacing:-2px}

/* 워드클라우드 */
.cloud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:center;
  align-content:center;min-height:100%;padding:10px}
.word{font-weight:800;line-height:1.15;letter-spacing:-.5px;word-break:keep-all;
  animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
.word small{font-size:.42em;opacity:.55;margin-left:4px;font-weight:700;vertical-align:super}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}

/* 의견 보드 */
.board{column-gap:14px;column-count:3}
@media(max-width:1400px){.board{column-count:2}}
.note{break-inside:avoid;margin-bottom:14px;padding:15px 17px;border-radius:15px;
  background:#0F1526;border:1px solid var(--line);border-left-width:4px;
  font-size:clamp(14px,1.25vw,18px);line-height:1.55;word-break:keep-all;
  animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.note .when{display:block;margin-top:8px;font-size:11px;color:var(--tx3);font-weight:700}

.blind{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--tx3)}
.blind .em{font-size:64px}
.blind .m{font-size:19px;font-weight:700}

/* ---------- 참가자 ---------- */
.pv{min-height:100dvh;background:#F6F8FD;color:#101828;display:flex;flex-direction:column}
.pvtop{background:#fff;border-bottom:1px solid #E4E9F2;padding:13px 18px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10}
.pvtop .rc{font-size:13px;font-weight:800;color:#5B6B8C;letter-spacing:1.5px}
.pvtop .anon{font-size:11.5px;font-weight:800;color:#0E9F6E;background:#E6FAF3;padding:5px 10px;border-radius:999px}
.pvbody{flex:1;padding:22px 18px 40px;max-width:640px;width:100%;margin:0 auto}
.pvq{font-size:23px;font-weight:800;line-height:1.4;margin:0 0 6px;word-break:keep-all;letter-spacing:-.4px}
.pvsub{font-size:14px;color:#6B7A99;margin:0 0 22px;line-height:1.5;word-break:keep-all}
.opt{width:100%;text-align:left;padding:17px 18px;border-radius:15px;background:#fff;
  border:2px solid #E4E9F2;font-size:16.5px;font-weight:600;color:#101828;margin-bottom:10px;
  display:flex;align-items:center;gap:13px;line-height:1.4;word-break:keep-all;transition:.14s}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #C5CEDF;flex:none}
.opt.on{border-color:#3B6BF5;background:#EFF4FF}
.opt.on .dot{border-color:#3B6BF5;background:#3B6BF5;box-shadow:inset 0 0 0 3.5px #fff}
.scaleopts{display:flex;gap:9px;margin-bottom:14px}
.sopt{flex:1;aspect-ratio:1/1.08;border-radius:15px;background:#fff;border:2px solid #E4E9F2;
  font-size:21px;font-weight:800;color:#101828;display:flex;align-items:center;justify-content:center}
.sopt.on{border-color:#3B6BF5;background:#3B6BF5;color:#fff}
.scalelbl{display:flex;justify-content:space-between;font-size:12.5px;color:#6B7A99;font-weight:700;margin-bottom:24px}
.pinp{width:100%;padding:16px;border-radius:15px;border:2px solid #E4E9F2;background:#fff;
  font-size:16.5px;color:#101828;outline:none;margin-bottom:10px}
.pinp:focus{border-color:#3B6BF5}
textarea.pinp{min-height:130px;resize:vertical;line-height:1.55}
.pbtn{width:100%;padding:17px;border-radius:15px;background:#3B6BF5;color:#fff;
  font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(59,107,245,.28)}
.pbtn:disabled{background:#C5CEDF;box-shadow:none}
.pbtn.ghost{background:#fff;color:#3B6BF5;border:2px solid #D6E0F7;box-shadow:none}
.done{text-align:center;padding:50px 20px}
.done .ic{width:78px;height:78px;border-radius:50%;background:#E6FAF3;color:#0E9F6E;font-size:38px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done h2{font-size:22px;margin:0 0 8px;font-weight:800}
.done p{color:#6B7A99;font-size:14.5px;margin:0;line-height:1.6}
.mytag{display:inline-block;margin-top:16px;padding:9px 15px;border-radius:12px;background:#F0F3FA;
  font-size:14px;font-weight:700;color:#31415F;max-width:100%;word-break:keep-all}
.waitbox{text-align:center;padding:70px 20px}
.pulse{width:56px;height:56px;border-radius:50%;background:#3B6BF5;margin:0 auto 22px;
  animation:pl 1.6s ease-in-out infinite;opacity:.85}
@keyframes pl{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1);opacity:.9}}
.wordchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.wchip{padding:9px 14px;border-radius:999px;background:#EFF4FF;color:#2B4FBF;font-size:14.5px;font-weight:700}

/* 참가자 결과 미니뷰 */
.mres{margin-top:26px;padding-top:22px;border-top:1px solid #E4E9F2}
.mres h4{font-size:13px;color:#6B7A99;margin:0 0 14px;font-weight:800}
.mbar{margin-bottom:11px}
.mbarl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:5px}
.mbart{height:11px;background:#E9EEF8;border-radius:6px;overflow:hidden}
.mbarf{height:100%;border-radius:6px;transition:width .5s}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;
  background:#101828;color:#fff;padding:13px 20px;border-radius:13px;font-size:14px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .25s both}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:860px){
  .stage{padding:14px}
  .stagemain{flex-direction:column;gap:12px}
  .side{width:100%;flex-direction:row;flex-wrap:wrap}
  .qrbox{max-width:150px}
  .mainpanel{padding:18px}
  .board{column-count:1}
  .typegrid{grid-template-columns:1fr}
}
</style>
</head>

const SERIES = ["#4F7BFF","#22D3A7","#FFB020","#FF5C7A","#A78BFA","#38BDF8","#F472B6","#4ADE80","#FB923C","#818CF8"];

/* ---------- 로컬 저장 ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
};

/* ============================================================
   백엔드
   ============================================================ */
class LocalBackend {
  constructor(){ this.kind="local"; }
  async init(){ return true; }
  _r(c){ return LS.get("lb_room_"+c, null); }
  async getRoom(c){ return this._r(c); }
  async setRoom(c,state){ LS.set("lb_room_"+c,{code:c,state,updated_at:nowISO()}); return true; }
  async addAnswer(room,qid,value,cid){
    const k="lb_ans_"+room; const a=LS.get(k,[]);
    a.push({id:Date.now()+Math.random(),room,qid,value,cid,created_at:nowISO()});
    LS.set(k,a.slice(-3000)); return true;
  }
  async getAnswers(room,qid){ return LS.get("lb_ans_"+room,[]).filter(x=>x.qid===qid); }
  async clearAnswers(room,qid){
    const k="lb_ans_"+room; LS.set(k, LS.get(k,[]).filter(x=>x.qid!==qid)); return true;
  }
  onAnswers(){ return ()=>{}; }
}

class SupaBackend {
  constructor(url,key){ this.kind="supabase"; this.url=url.replace(/\/+$/,""); this.key=key; }
  async init(){
    const m = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    this.sb = m.createClient(this.url,this.key,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:12}}});
    const {error} = await this.sb.from("poll_rooms").select("code").limit(1);
    if(error) throw new Error(error.message);
    return true;
  }
  async getRoom(c){
    const {data,error}=await this.sb.from("poll_rooms").select("*").eq("code",c).maybeSingle();
    if(error) throw new Error(error.message); return data;
  }
  async setRoom(c,state){
    const {error}=await this.sb.from("poll_rooms").upsert({code:c,state,updated_at:nowISO()});
    if(error) throw new Error(error.message); return true;
  }
  async addAnswer(room,qid,value,cid){
    const {error}=await this.sb.from("poll_answers").insert({room,qid,value,cid});
    if(error) throw new Error(error.message); return true;
  }
  async getAnswers(room,qid){
    const {data,error}=await this.sb.from("poll_answers").select("*")
      .eq("room",room).eq("qid",qid).order("created_at",{ascending:true}).limit(3000);
    if(error) throw new Error(error.message); return data||[];
  }
  async clearAnswers(room,qid){
    const {error}=await this.sb.from("poll_answers").delete().eq("room",room).eq("qid",qid);
    if(error) throw new Error(error.message); return true;
  }
  onAnswers(room,cb){
    const ch=this.sb.channel("ans_"+room)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"poll_answers",filter:"room=eq."+room},cb)
      .subscribe();
    return ()=>{ try{this.sb.removeChannel(ch)}catch(e){} };
  }
}

const QTYPES = {

  scale :{name:"척도 평가",  desc:"1~N점 선택 → 평균 점수와 분포 표시",       icon:"📈"},
  word  :{name:"워드클라우드",desc:"단어 입력 → 많이 나온 단어가 크게 표시",   icon:"☁️"},

/* ============================================================
   집계
   ============================================================ */
function dedupeLatest(rows){ // 같은 참가자의 마지막 응답만
  const m=new Map(); rows.forEach(r=>m.set(r.cid||r.id,r)); return [...m.values()];
}
function tally(q,rows){
  if(!q) return {n:0};
  if(q.type==="choice"){
    const rs=dedupeLatest(rows); const c={}; (q.options||[]).forEach(o=>c[o]=0);
    rs.forEach(r=>{ if(r.value in c) c[r.value]++; });
    const n=rs.length;
    return {n, items:(q.options||[]).map((o,i)=>({label:o,count:c[o],pct:n?Math.round(c[o]/n*1000)/10:0,color:SERIES[i%SERIES.length]}))};
  }
  if(q.type==="scale"){
    const rs=dedupeLatest(rows).map(r=>parseInt(r.value,10)).filter(v=>!isNaN(v));
    const min=q.min??1,max=q.max??5; const c={}; for(let i=min;i<=max;i++)c[i]=0;
    rs.forEach(v=>{if(v in c)c[v]++});
    const n=rs.length, avg=n?rs.reduce((a,b)=>a+b,0)/n:0;
    const mx=Math.max(1,...Object.values(c));
    return {n,avg,min,max,items:Object.keys(c).map((k,i)=>({label:k,count:c[k],h:c[k]/mx*100,pct:n?Math.round(c[k]/n*100):0,color:SERIES[i%SERIES.length]}))};
  }
  if(q.type==="word"){
    const c=new Map();
    rows.forEach(r=>{const w=String(r.value||"").trim(); if(!w)return;
      const k=w.toLowerCase(); const e=c.get(k)||{w,n:0}; e.n++; c.set(k,e);});
    const arr=[...c.values()].sort((a,b)=>b.n-a.n).slice(0,60);
    const mx=arr.length?arr[0].n:1;
    return {n:rows.length, uniq:arr.length, items:arr.map((e,i)=>({...e,r:e.n/mx,color:SERIES[i%SERIES.length]}))};
  }
  return {n:rows.length, items:[...rows].reverse().map((r,i)=>({text:r.value,at:r.created_at,color:SERIES[i%SERIES.length]}))};
}

/* ============================================================
   렌더 - 결과 시각화 (발표 화면)
   ============================================================ */
function vizHTML(q,t){
  if(!q) return "";
  if(t.n===0) return `<div class="blind"><div class="em">⏳</div><div class="m">응답을 기다리는 중입니다</div>
    <div class="tiny">QR을 스캔해 참여해 주세요</div></div>`;
  if(q.type==="choice") return t.items.map(it=>`
    <div class="bar"><div class="barlbl"><span class="t">${esc(it.label)}</span>
      <span class="v">${it.pct}%<small>${it.count}명</small></span></div>
      <div class="bartrack"><div class="barfill" style="width:${Math.max(it.pct,0)}%;background:${it.color}"></div></div></div>`).join("");
  if(q.type==="scale") return `
    <div class="scalewrap">${t.items.map(it=>`<div class="scalecol">
      <div class="scalen">${it.count}</div>
      <div class="scalebar" style="height:${it.h}%;background:${it.color}"></div>
      <div class="scalen" style="color:var(--tx)">${it.label}</div></div>`).join("")}</div>
    <div class="avgbox"><span class="tiny" style="font-size:14px;font-weight:800">평균</span>
      <span class="big">${t.avg.toFixed(2)}</span>
      <span class="muted" style="font-size:17px;font-weight:700">/ ${t.max}점 · 응답 ${t.n}명</span></div>`;
  if(q.type==="word"){
    const k=Math.max(30,Math.min(92,96-t.items.length*1.15));
    return `<div class="cloud">${t.items.map((it,i)=>{
      const size=18+Math.pow(it.r,.58)*k;
      return `<span class="word" style="font-size:${size.toFixed(1)}px;color:${it.color};animation-delay:${Math.min(i*22,700)}ms">${esc(it.w)}<small>${it.n}</small></span>`;
    }).join("")}</div>`;
  }
  return `<div class="board">${t.items.map((it,i)=>`
    <div class="note" style="border-left-color:${it.color};animation-delay:${Math.min(i*35,600)}ms">${esc(it.text)}</div>`).join("")}</div>`;
}

const brandHTML=()=>`<div class="brand"><div class="logo">Q</div>
  <div><h1>실시간 인터랙티브 투표</h1><p>익명 · QR 접속 · 200명 이상 동시 참여</p></div></div>`;

/* ============================================================
   뷰: 강사 홈
   ============================================================ */
function viewHome(){
  const qs=S.deck.questions;
  app.innerHTML=`<div class="shell">
    ${brandHTML()}
    ${S.demo?`<div class="card sec" style="border-color:#4a3a2a;background:rgba(255,176,32,.06)">
      <b style="color:var(--ac3);font-size:13px">🧪 데모 모드</b>
      <div class="tiny" style="margin-top:6px;line-height:1.6;color:#FFD79A">
        이 기기 안에서만 동작합니다(브라우저 탭 2개로 강사·참가자 화면을 동시에 테스트 가능).
        실제 교육에서는 서버 연결 후 사용하세요.</div></div>`:""}

    <div class="card sec">
      <div class="row wrap" style="justify-content:space-between;margin-bottom:14px">
        <div><div style="font-size:16px;font-weight:800">${esc(S.deck.name)}</div>
          <div class="tiny" style="margin-top:3px">질문 ${qs.length}개</div></div>
        <div class="row">
          <button class="btn sm" id="bRename">이름 변경</button>
          <button class="btn sm" id="bExport">내보내기</button>
          <button class="btn sm" id="bImport">불러오기</button>

      <div id="qlist">${qs.map((q,i)=>qItemHTML(q,i,qs.length)).join("")||
        `<div class="tiny" style="padding:20px;text-align:center">질문이 없습니다. 아래에서 추가해 주세요.</div>`}</div>
      <button class="btn pri" id="bAdd" style="width:100%;margin-top:12px">＋ 질문 추가</button>
    </div>

    <div class="card">
      <h2>세션 시작</h2>
      <div class="row wrap" style="gap:12px">
        <div class="grow" style="min-width:180px">
          <label class="tiny" style="display:block;margin-bottom:6px;font-weight:700">방 코드</label>
          <input class="inp" id="iRoom" value="${esc(S.hostRoom||newCode())}" maxlength="6" style="letter-spacing:3px;font-weight:800;text-transform:uppercase">
        </div>
        <button class="btn" id="bNewCode" style="align-self:flex-end">새 코드</button>
        <button class="btn pri" id="bStart" style="align-self:flex-end;padding:13px 26px" ${qs.length?"":"disabled"}>진행 화면 열기 ▶</button>
      </div>
      <p class="tiny" style="margin:14px 0 0;line-height:1.7">
        진행 화면에서 QR과 접속 주소가 크게 표시됩니다. 참가자는 로그인·설치 없이 접속하며,
        이름·이메일 등 어떤 개인정보도 수집하지 않습니다.</p>
    </div>
  </div>`;

  $("#bAdd").onclick=()=>editQ(null);
  $("#bRename").onclick=()=>{const v=prompt("질문 세트 이름",S.deck.name); if(v){S.deck.name=v.trim()||S.deck.name;saveDeck();viewHome();}};
  $("#bExport").onclick=()=>{
    const b=new Blob([JSON.stringify(S.deck,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download=`질문세트_${S.deck.name.replace(/\s+/g,"_")}.json`; a.click(); toast("파일로 저장했습니다");
  };
  $("#bImport").onclick=()=>{
    const f=document.createElement("input"); f.type="file"; f.accept=".json,application/json";
    f.onchange=()=>{const r=new FileReader(); r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(!d.questions||!Array.isArray(d.questions)) throw 0;
      d.questions.forEach(q=>{ if(!q.id) q.id=uid(); });
      S.deck=d; saveDeck(); viewHome(); toast("불러왔습니다");
    }catch(e){toast("형식이 올바르지 않습니다")}}; r.readAsText(f.files[0]);};
    f.click();
  };
  $("#bNewCode").onclick=()=>{$("#iRoom").value=newCode();};
  $("#bStart").onclick=async()=>{
    const c=$("#iRoom").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(c.length<3) return toast("방 코드는 3자 이상");
    S.hostRoom=c; LS.set("pv_hostroom",c); S.room=c;
    await S.be.setRoom(c,{activeQid:null,open:false,revealed:true,phone:false,question:null,deckName:S.deck.name});
    S.view="stage"; S.idx=0; renderStage(); startHostLoop();
  };
  $("#qlist").onclick=e=>{
    const b=e.target.closest("[data-a]"); if(!b) return;
    const i=+b.dataset.i, a=b.dataset.a, qs=S.deck.questions;
    if(a==="edit") editQ(i);
    else if(a==="del"){ if(confirm("이 질문을 삭제할까요?")){qs.splice(i,1);saveDeck();viewHome();} }
    else if(a==="up"&&i>0){ [qs[i-1],qs[i]]=[qs[i],qs[i-1]]; saveDeck(); viewHome(); }
    else if(a==="dn"&&i<qs.length-1){ [qs[i+1],qs[i]]=[qs[i],qs[i+1]]; saveDeck(); viewHome(); }
  };
}

function qItemHTML(q,i,n){
  const t=QTYPES[q.type]||QTYPES.choice;
  let meta="";
  if(q.type==="choice") meta=`<span class="chip">보기 ${q.options?.length||0}개</span>`;
  if(q.type==="scale")  meta=`<span class="chip">${q.min??1}~${q.max??5}점</span>`;
  if(q.type==="word")   meta=`<span class="chip">1인 최대 ${q.maxWords??3}개</span>`;
  if(q.type==="open")   meta=`<span class="chip">${q.maxLen??150}자</span>`;
  return `<div class="qitem"><div class="qnum">${i+1}</div>
    <div class="qbody"><div class="qtitle">${esc(q.title)}</div>
      <div class="qmeta"><span class="chip g">${t.icon} ${t.name}</span>${meta}</div></div>
    <div class="qacts">
      <button class="iconbtn" data-a="up" data-i="${i}" ${i===0?"disabled":""}>↑</button>
      <button class="iconbtn" data-a="dn" data-i="${i}" ${i===n-1?"disabled":""}>↓</button>
      <button class="iconbtn" data-a="edit" data-i="${i}">✎</button>
      <button class="iconbtn" data-a="del" data-i="${i}">🗑</button>
    </div></div>`;
}

/* ---------- 질문 편집 모달 ---------- */
function editQ(idx){
  const isNew = idx===null;
  const q = isNew ? {id:uid(),type:"choice",title:"",options:["","",""],min:1,max:5,minLabel:"전혀 아니다",maxLabel:"매우 그렇다",maxWords:3,maxLen:150}
                  : JSON.parse(JSON.stringify(S.deck.questions[idx]));
  q.options ||= ["","",""]; q.min??=1; q.max??=5; q.minLabel??="전혀 아니다"; q.maxLabel??="매우 그렇다"; q.maxWords??=3; q.maxLen??=150;

  const m=document.createElement("div"); m.className="modal"; document.body.appendChild(m);
  const draw=()=>{
    m.innerHTML=`<div class="box">
      <h3>${isNew?"질문 추가":"질문 수정"}</h3>
      <div class="fld"><label>질문 유형</label>
        <div class="typegrid">${Object.entries(QTYPES).map(([k,v])=>`
          <button class="typebtn ${q.type===k?"on":""}" data-t="${k}">
            <b>${v.icon} ${v.name}</b><span>${v.desc}</span></button>`).join("")}</div></div>
      <div class="fld"><label>질문 내용</label>
        <textarea class="inp" id="qT" rows="2" placeholder="참가자에게 보여줄 질문을 입력하세요">${esc(q.title)}</textarea></div>
      ${q.type==="choice"?`
        <div class="fld"><label>보기 (2~10개)</label>
          <div id="opts">${q.options.map((o,i)=>`<div class="row" style="margin-bottom:7px">
            <input class="inp" data-oi="${i}" value="${esc(o)}" placeholder="보기 ${i+1}">
            <button class="iconbtn" data-ro="${i}">✕</button></div>`).join("")}</div>
          <button class="btn sm" id="bAddOpt" style="margin-top:4px">＋ 보기 추가</button></div>`:""}
      ${q.type==="scale"?`
        <div class="row" style="gap:10px">
          <div class="fld grow"><label>최소값</label><input class="inp" id="qMin" type="number" value="${q.min}"></div>
          <div class="fld grow"><label>최대값</label><input class="inp" id="qMax" type="number" value="${q.max}"></div></div>
        <div class="row" style="gap:10px">
          <div class="fld grow"><label>최소 라벨</label><input class="inp" id="qMinL" value="${esc(q.minLabel)}"></div>
          <div class="fld grow"><label>최대 라벨</label><input class="inp" id="qMaxL" value="${esc(q.maxLabel)}"></div></div>`:""}
      ${q.type==="word"?`
        <div class="fld"><label>1인당 입력 가능 단어 수</label>
          <input class="inp" id="qMW" type="number" min="1" max="5" value="${q.maxWords}"></div>`:""}
      ${q.type==="open"?`
        <div class="fld"><label>최대 글자 수</label>
          <input class="inp" id="qML" type="number" min="20" max="500" value="${q.maxLen}"></div>`:""}
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn" id="bCancel">취소</button>
        <button class="btn pri" id="bSave">저장</button></div>
    </div>`;
    m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{sync();q.type=b.dataset.t;draw();});
    m.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>{sync();
      if(q.options.length<=2) return toast("보기는 최소 2개");
      q.options.splice(+b.dataset.ro,1);draw();});
    const ao=$("#bAddOpt",m); if(ao) ao.onclick=()=>{sync(); if(q.options.length>=10)return toast("최대 10개"); q.options.push("");draw();};
    $("#bCancel",m).onclick=()=>m.remove();
    $("#bSave",m).onclick=()=>{
      sync();
      if(!q.title.trim()) return toast("질문 내용을 입력해 주세요");
      if(q.type==="choice"){ q.options=q.options.map(o=>o.trim()).filter(Boolean);
        if(q.options.length<2) return toast("보기를 2개 이상 입력해 주세요"); }
      if(q.type==="scale"&&q.max<=q.min) return toast("최대값이 최소값보다 커야 합니다");
      if(isNew) S.deck.questions.push(q); else S.deck.questions[idx]=q;
      saveDeck(); m.remove(); viewHome(); toast("저장했습니다");
    };
  };
  const sync=()=>{
    const t=$("#qT",m); if(t) q.title=t.value;
    m.querySelectorAll("[data-oi]").forEach(i=>q.options[+i.dataset.oi]=i.value);
    const g=(id,f)=>{const e=$(id,m); if(e) f(e.value);};
    g("#qMin",v=>q.min=parseInt(v)||1); g("#qMax",v=>q.max=parseInt(v)||5);
    g("#qMinL",v=>q.minLabel=v); g("#qMaxL",v=>q.maxLabel=v);
    g("#qMW",v=>q.maxWords=Math.max(1,Math.min(5,parseInt(v)||3)));
    g("#qML",v=>q.maxLen=Math.max(20,Math.min(500,parseInt(v)||150)));
  };
  draw();
}

/* ============================================================
   뷰: 진행(발표) 화면
   ============================================================ */
let hostTimer=null, hostUnsub=null, hostDirty=true;
function startHostLoop(){
  stopHostLoop();
  if(S.be.onAnswers) hostUnsub=S.be.onAnswers(S.room,()=>{hostDirty=true;});
  hostTimer=setInterval(async()=>{
    const q=curQ(); if(!q) return;
    try{ const rows=await S.be.getAnswers(S.room,q.id);
      if(rows.length!==S.answers.length||hostDirty){ S.answers=rows; hostDirty=false; paintViz(); }
    }catch(e){}
  },1500);
}
function stopHostLoop(){ if(hostTimer)clearInterval(hostTimer); hostTimer=null; if(hostUnsub)hostUnsub(); hostUnsub=null; }
const curQ = ()=>S.deck.questions[S.idx]||null;

async function pushRoom(patch){
  const q=curQ();
  const st={activeQid:q?q.id:null, open:true, revealed:true, phone:false, deckName:S.deck.name,
    question:q?JSON.parse(JSON.stringify(q)):null, ...(S.rs||{}), ...patch};
  if(q){ st.activeQid=q.id; st.question=JSON.parse(JSON.stringify(q)); }
  S.rs=st; await S.be.setRoom(S.room,st);
}

function joinURL(){ const u=new URL(location.href); u.search="?r="+S.room+(S.demo?"&demo=1":""); u.hash=""; return u.toString(); }

function renderStage(){
  const q=curQ(), n=S.deck.questions.length;
  app.innerHTML=`<div class="stage">
    <div class="stagetop">
      <button class="btn sm" id="bBack">← 목록</button>
      <span class="pill">${S.idx+1} / ${n}</span>
      <span class="chip g">🔒 익명 응답</span>
      <div class="grow"></div>
      <span class="chip o" id="stConn">연결됨</span>
      <button class="btn sm" id="bFull">전체화면</button>
    </div>
    <div class="stagemain">
      <div class="side">
        <div class="qrbox" id="qr"></div>
        <div class="joinurl">${esc(joinURL().replace(/^https?:\/\//,""))}</div>
        <div class="codebig">${esc(S.room)}</div>
        <div class="counter"><div class="n" id="cnt">0</div><div class="l">응답 수</div></div>
      </div>
      <div class="mainpanel">
        <h2 class="qhead">${q?esc(q.title):"질문이 없습니다"}</h2>
        <div class="viz" id="viz"></div>
      </div>
    </div>
    <div class="stagebar">
      <button class="btn" id="bPrev" ${S.idx===0?"disabled":""}>◀ 이전</button>
      <button class="btn pri" id="bNext" ${S.idx>=n-1?"disabled":""}>다음 ▶</button>
      <div style="width:8px"></div>
      <button class="btn" id="bOpen">${(S.rs?.open??true)?"응답 마감":"응답 열기"}</button>
      <button class="btn" id="bReveal">${(S.rs?.revealed??true)?"결과 가리기":"결과 보이기"}</button>
      <button class="btn" id="bPhone">휴대폰에 결과 표시: ${(S.rs?.phone??false)?"켬":"끔"}</button>
      <div class="grow"></div>
      <button class="btn danger" id="bClear">이 질문 응답 초기화</button>
    </div>
  </div>`;
  try{ new QRCode($("#qr"),{text:joinURL(),width:230,height:230,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ $("#qr").innerHTML=`<div style="color:#101828;font-size:12px;padding:20px;text-align:center">QR 생성 실패<br>주소를 직접 안내해 주세요</div>`; }

  $("#bBack").onclick=()=>{stopHostLoop();S.view="home";viewHome();};
  $("#bFull").onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); };
  $("#bPrev").onclick=()=>go(S.idx-1);
  $("#bNext").onclick=()=>go(S.idx+1);
  $("#bOpen").onclick=async e=>{ const v=!(S.rs?.open??true); await pushRoom({open:v});
    e.target.textContent=v?"응답 마감":"응답 열기"; toast(v?"응답을 다시 받습니다":"응답을 마감했습니다"); };
  $("#bReveal").onclick=async e=>{ const v=!(S.rs?.revealed??true); await pushRoom({revealed:v});
    e.target.textContent=v?"결과 가리기":"결과 보이기"; paintViz(); };
  $("#bPhone").onclick=async e=>{ const v=!(S.rs?.phone??false); await pushRoom({phone:v});
    e.target.textContent="휴대폰에 결과 표시: "+(v?"켬":"끔"); };
  $("#bClear").onclick=async()=>{ const q=curQ(); if(!q)return;
    if(!confirm("이 질문의 응답을 모두 지울까요?")) return;
    await S.be.clearAnswers(S.room,q.id); S.answers=[]; paintViz(); toast("초기화했습니다"); };
  go(S.idx,true);
}

async function go(i,first){
  const n=S.deck.questions.length; if(i<0||i>=n) return;
  S.idx=i; S.answers=[];
  if(!first) renderStage();
  await pushRoom({open:true});
  try{ S.answers=await S.be.getAnswers(S.room,curQ().id); }catch(e){}
  paintViz();
}

function paintViz(){
  const q=curQ(); if(!q) return;
  const t=tally(q,S.answers);
  const c=$("#cnt"); if(c) c.textContent = q.type==="choice"||q.type==="scale" ? t.n : S.answers.length;
  const v=$("#viz"); if(!v) return;
  if(!(S.rs?.revealed??true)){
    v.className="viz empty";
    v.innerHTML=`<div class="blind"><div class="em">🙈</div><div class="m">결과를 잠시 가려두었습니다</div>
      <div class="tiny">응답 ${S.answers.length}건 수집됨 · 아래 [결과 보이기]로 공개</div></div>`; return;
  }
  v.className="viz "+(t.n===0?"empty":q.type);
  v.innerHTML=vizHTML(q,t);
}

/* ============================================================
   뷰: 참가자
   ============================================================ */
let pvTimer=null, pvLastQ=null, pvSel=null, pvWords=[];
async function viewParticipant(){
  stopHostLoop();
  const tick=async()=>{
    try{
      const r=await S.be.getRoom(S.room);
      const st=r?.state||null;
      const changed = JSON.stringify([st?.activeQid,st?.open,st?.revealed,st?.phone])!==JSON.stringify(pvLastQ);
      if(changed){ pvLastQ=[st?.activeQid,st?.open,st?.revealed,st?.phone]; S.rs=st;
        if(st?.activeQid!==S.pvQid){ S.pvQid=st?.activeQid; pvSel=null; pvWords=[]; }
        drawP(st);
      } else if(st?.phone && st?.revealed && S.submitted[S.pvQid]) { refreshMini(); }
    }catch(e){}
  };
  await tick(); if(pvTimer)clearInterval(pvTimer); pvTimer=setInterval(tick,2500);
}

function pvShell(inner,rc){
  app.innerHTML=`<div class="pv"><div class="pvtop">
    <span class="rc">${esc(rc||S.room)}</span>
    <span class="anon">🔒 익명 · 이름 수집 안 함</span></div>
    <div class="pvbody">${inner}</div></div>`;
}

function drawP(st){
  if(!st||!st.question){
    pvShell(`<div class="waitbox"><div class="pulse"></div>
      <h2 style="font-size:20px;margin:0 0 8px;font-weight:800">접속되었습니다</h2>
      <p style="color:#6B7A99;font-size:14.5px;margin:0;line-height:1.6">
        강사가 첫 번째 질문을 열면<br>이 화면에 자동으로 나타납니다.</p></div>`);
    return;
  }
  const q=st.question;
  if(S.submitted[q.id]){ drawDone(q,st); return; }
  if(st.open===false){
    pvShell(`<div class="waitbox"><div style="font-size:52px;margin-bottom:16px">⛔</div>
      <h2 style="font-size:20px;margin:0 0 8px;font-weight:800">응답이 마감되었습니다</h2>
      <p style="color:#6B7A99;font-size:14.5px;margin:0">다음 질문을 기다려 주세요.</p></div>`);
    return;
  }
  let body="";
  if(q.type==="choice"){
    body=`<p class="pvsub">하나를 선택해 주세요</p>
      ${(q.options||[]).map((o,i)=>`<button class="opt ${pvSel===o?"on":""}" data-o="${esc(o)}">
        <span class="dot"></span><span>${esc(o)}</span></button>`).join("")}
      <button class="pbtn" id="pSub" style="margin-top:12px" ${pvSel?"":"disabled"}>제출하기</button>`;
  } else if(q.type==="scale"){
    const min=q.min??1,max=q.max??5,arr=[];
    for(let i=min;i<=max;i++)arr.push(i);
    body=`<p class="pvsub">점수를 선택해 주세요</p>
      <div class="scaleopts">${arr.map(v=>`<button class="sopt ${String(pvSel)===String(v)?"on":""}" data-o="${v}">${v}</button>`).join("")}</div>
      <div class="scalelbl"><span>${esc(q.minLabel||"낮음")}</span><span>${esc(q.maxLabel||"높음")}</span></div>
      <button class="pbtn" id="pSub" ${pvSel!==null?"":"disabled"}>제출하기</button>`;
  } else if(q.type==="word"){
    const mw=q.maxWords??3;
    body=`<p class="pvsub">떠오르는 단어를 최대 ${mw}개까지 입력해 주세요</p>
      ${pvWords.length?`<div class="wordchips">${pvWords.map((w,i)=>`<span class="wchip">${esc(w)} <b data-rw="${i}" style="cursor:pointer;opacity:.6">✕</b></span>`).join("")}</div>`:""}
      ${pvWords.length<mw?`<input class="pinp" id="pW" maxlength="20" placeholder="단어 입력 (예: 경청)" autocomplete="off">
      <button class="pbtn ghost" id="pAddW" style="margin-bottom:12px">＋ 단어 담기</button>`:
      `<p class="pvsub" style="margin-bottom:12px">최대 개수까지 입력하셨습니다</p>`}
      <button class="pbtn" id="pSub" ${pvWords.length?"":"disabled"}>제출하기 (${pvWords.length}개)</button>`;
  } else {
    const ml=q.maxLen??150;
    body=`<p class="pvsub">자유롭게 의견을 남겨주세요 · 최대 ${ml}자 · 익명입니다</p>
      <textarea class="pinp" id="pT" maxlength="${ml}" placeholder="여기에 입력해 주세요"></textarea>
      <div class="scalelbl"><span id="pCnt">0 / ${ml}</span><span></span></div>
      <button class="pbtn" id="pSub" disabled>제출하기</button>`;
  }
  pvShell(`<h1 class="pvq">${esc(q.title)}</h1>${body}`);

  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ pvSel=b.dataset.o; drawP(st); });
  app.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{ pvWords.splice(+b.dataset.rw,1); drawP(st); });
  const aw=$("#pAddW");
  if(aw) aw.onclick=()=>{ const e=$("#pW"); const v=(e.value||"").trim();
    if(!v) return; if(pvWords.includes(v)) {toast("이미 담은 단어입니다"); return;}
    pvWords.push(v); drawP(st); };
  const wi=$("#pW"); if(wi){ wi.focus(); wi.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();aw&&aw.click();}} }
  const ta=$("#pT"); if(ta) ta.oninput=()=>{ $("#pCnt").textContent=`${ta.value.length} / ${q.maxLen??150}`;
    $("#pSub").disabled=!ta.value.trim(); };
  const sb=$("#pSub"); if(sb) sb.onclick=()=>submitP(q,st);
}

async function submitP(q,st){
  const btn=$("#pSub"); if(btn){btn.disabled=true;btn.textContent="전송 중…";}
  try{
    if(q.type==="word"){ for(const w of pvWords) await S.be.addAnswer(S.room,q.id,w,S.cid+"_"+uid()); }
    else if(q.type==="open"){ const v=$("#pT").value.trim(); if(!v) throw new Error("내용을 입력해 주세요");
      await S.be.addAnswer(S.room,q.id,v,S.cid+"_"+uid()); }
    else { await S.be.addAnswer(S.room,q.id,String(pvSel),S.cid); }
    S.submitted[q.id]=q.type==="word"?pvWords.join(", "):(q.type==="open"?$("#pT").value.trim():String(pvSel));
    drawDone(q,st);
  }catch(e){ toast(e.message||"전송에 실패했습니다. 다시 시도해 주세요");
    if(btn){btn.disabled=false;btn.textContent="제출하기";} }
}

function drawDone(q,st){
  pvShell(`<div class="done"><div class="ic">✓</div>
    <h2>응답이 접수되었습니다</h2>
    <p>결과는 앞 화면에서 함께 확인해 주세요.<br>다음 질문이 열리면 자동으로 넘어갑니다.</p>
    ${S.submitted[q.id]?`<div class="mytag">내 응답 · ${esc(S.submitted[q.id])}</div>`:""}
    </div><div id="mini"></div>`);
  if(st?.phone&&st?.revealed) refreshMini();
}

async function refreshMini(){
  const box=$("#mini"); if(!box) return;
  const q=S.rs?.question; if(!q) return;
  try{
    const rows=await S.be.getAnswers(S.room,q.id); const t=tally(q,rows);
    if(q.type==="choice"||q.type==="scale"){
      box.innerHTML=`<div class="mres"><h4>실시간 결과 · 응답 ${t.n}명</h4>
        ${t.items.map(it=>`<div class="mbar"><div class="mbarl"><span>${esc(it.label)}${q.type==="scale"?"점":""}</span>
          <span>${q.type==="choice"?it.pct+"%":it.count+"명"}</span></div>
          <div class="mbart"><div class="mbarf" style="width:${q.type==="choice"?it.pct:(t.n?it.count/t.n*100:0)}%;background:${it.color}"></div></div></div>`).join("")}
        ${q.type==="scale"?`<div style="margin-top:14px;font-size:15px;font-weight:800">평균 ${t.avg.toFixed(2)}점</div>`:""}</div>`;
    } else if(q.type==="word"){
      box.innerHTML=`<div class="mres"><h4>실시간 결과 · ${t.items.length}개 단어</h4>
        <div class="wordchips">${t.items.slice(0,25).map(it=>`<span class="wchip" style="font-size:${13+it.r*9}px">${esc(it.w)} <b>${it.n}</b></span>`).join("")}</div></div>`;
    } else {
      box.innerHTML=`<div class="mres"><h4>실시간 의견 · ${t.items.length}건</h4>
        ${t.items.slice(0,20).map(it=>`<div style="padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #E4E9F2;margin-bottom:8px;font-size:14.5px;line-height:1.55">${esc(it.text)}</div>`).join("")}</div>`;
    }
  }catch(e){}
}

/* ============================================================
   부팅
   ============================================================ */
async function boot(){
  viewLoading();
  if(!S.be){
    if(S.demo){ S.be=new LocalBackend(); await S.be.init(); }
    else{
      const u=LS.get("pv_url","")||CONFIG.SUPABASE_URL, k=LS.get("pv_key","")||CONFIG.SUPABASE_ANON_KEY;
      if(!u||!k||u.startsWith("PASTE")||k.startsWith("PASTE")){ viewSetup(); return; }
      try{ const be=new SupaBackend(u,k); await be.init(); S.be=be; }
      catch(e){ viewSetup(e.message||String(e)); return; }
    }
  }
  if(S.room){ S.view="participant"; viewParticipant(); }
  else { S.view="home"; viewHome(); }
}
window.addEventListener("beforeunload",()=>{stopHostLoop(); if(pvTimer)clearInterval(pvTimer);});
boot();
</script>
</body>
</html>
